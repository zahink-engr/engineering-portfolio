<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1210" viewBox="0 0 1280 1210" role="img" aria-labelledby="title desc"><title id="title">Reconciled roaster electrical architecture</title><desc id="desc">Separate heater and control-power branches, hardware heater permit, proposed sensors and staged vision. Concept only.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a9bcac"/></marker><style>text{font-family:Arial,sans-serif;fill:#eeeae1}.title{font-size:32px}.head{font-size:16px;fill:#ee8b86}.label{font-size:21px;font-weight:bold}.small{font-size:17px;fill:#b5bdb5}.box{fill:#19231d;stroke:#65766a;stroke-width:1.5}.wire{fill:none;stroke:#a9bcac;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1280" height="1210" fill="#101411"/><rect class="box" x="40" y="162" width="350" height="114"/><rect class="box" x="440" y="162" width="370" height="114"/><rect class="box" x="860" y="162" width="380" height="114"/><rect class="box" x="40" y="318" width="1200" height="164"/><rect class="box" x="40" y="526" width="350" height="138"/><rect class="box" x="440" y="526" width="370" height="138"/><rect class="box" x="860" y="526" width="380" height="138"/><rect class="box" x="40" y="710" width="350" height="222"/><rect class="box" x="440" y="710" width="370" height="222"/><rect class="box" x="860" y="710" width="380" height="222"/><rect class="box" x="40" y="984" width="350" height="138"/><rect class="box" x="440" y="984" width="370" height="138"/><rect class="box" x="860" y="984" width="380" height="138"/><path class="wire" d="M390 220H440M810 220H860"/><path class="wire" d="M625 318V276"/><path class="wire" d="M40 240H20V502H215V526M390 570H440M390 638H415V686H835V570H860"/><path class="wire" d="M390 816H440"/><path class="wire" d="M390 1050H440M625 932V984"/><text x="40" y="44" class="head">COFFEE ROASTER / OCTOBER 2026 PLAN</text><text x="40" y="88" class="title">Tentative electrical architecture</text><text x="40" y="120" class="small">Functional blocks only. Exact ratings, interfaces and shutdown behavior still need review and testing.</text><text x="56" y="194" class="label">120 VAC input</text><text x="56" y="223" class="small">Upstream GFCI → rated inlet / fuse</text><text x="56" y="249" class="small">Master disconnect → both branches</text><text x="456" y="194" class="label">Heater branch</text><text x="456" y="223" class="small">Contactor → zero-cross SSR</text><text x="456" y="249" class="small">One-shot thermal fuse → heater</text><text x="876" y="194" class="label">Heater target</text><text x="876" y="223" class="small">120 V / 1200–1500 W</text><text x="876" y="249" class="small">Circuit and exact element undecided</text><text x="56" y="350" class="label">24 V heater-permit chain — gates the contactor coil</text><text x="56" y="379" class="small">NC E-stop → manual-reset high-limit → airflow-proving switch → watchdog-supervised enable</text><text x="56" y="405" class="small">Independent heartbeat timeout, latched shutdown and manual rearm: circuit design pending.</text><text x="56" y="431" class="small">Heater stop leaves blower/drum power available for cooldown; master disconnect removes both branches.</text><text x="56" y="457" class="small">This is not an all-motion stop. Guarding, restart prevention and fault behavior require review.</text><text x="56" y="558" class="label">Control-power branch</text><text x="56" y="587" class="small">24 V PSU; ≥6.5 A provisional</text><text x="56" y="613" class="small">Branch fuse + buck-output fuses</text><text x="56" y="639" class="small">Protective earth to exposed metal</text><text x="456" y="558" class="label">Motor and blowers</text><text x="456" y="587" class="small">NEMA17 + TMC2209; belt drive</text><text x="456" y="613" class="small">Blower PWM / analog input</text><text x="456" y="639" class="small">Do not chop roast-blower supply</text><text x="876" y="558" class="label">Regulated rails</text><text x="876" y="587" class="small">5 V buck → Teensy VIN / rated loads</text><text x="876" y="613" class="small">3.3 V-compatible sensor interfaces</text><text x="876" y="639" class="small">6 V servo rail deferred</text><text x="56" y="742" class="label">Sensors</text><text x="56" y="771" class="small">5 × K / MAX31856, ~10 Hz target</text><text x="56" y="797" class="small">ADXL345 SPI, 800 Hz target</text><text x="56" y="823" class="small">SHT31 + pressure / tach</text><text x="56" y="849" class="small">I2S audio, 44.1 kHz target</text><text x="56" y="875" class="small">Encoder: hardware quadrature</text><text x="56" y="901" class="small">K wire + K mini connectors</text><text x="456" y="742" class="label">Teensy 4.1</text><text x="456" y="771" class="small">Timestamps / fault handling</text><text x="456" y="797" class="small">Bounded actuator commands</text><text x="456" y="823" class="small">SSR input driver + step/dir</text><text x="456" y="849" class="small">Compatible blower interface</text><text x="456" y="875" class="small">Heartbeat to permit circuit</text><text x="456" y="901" class="small">VIN/VUSB separation to resolve</text><text x="876" y="742" class="label">Power and mass</text><text x="876" y="771" class="small">INA226: 24 V rail only</text><text x="876" y="797" class="small">AC meter candidate: PZEM v3</text><text x="876" y="823" class="small">Verify module isolation / levels</text><text x="876" y="849" class="small">Duty, voltage, power logged apart</text><text x="876" y="875" class="small">Off-machine 0.01 g scale</text><text x="876" y="901" class="small">HX711 fixture optional</text><text x="56" y="1016" class="label">V2 camera and lighting</text><text x="56" y="1045" class="small">Color USB module candidate</text><text x="56" y="1071" class="small">Steady LED + borosilicate glass</text><text x="56" y="1097" class="small">Cold-side purge before heater</text><text x="456" y="1016" class="label">Laptop</text><text x="456" y="1045" class="small">Compatible isolated USB to Teensy</text><text x="456" y="1071" class="small">Direct USB camera connection</text><text x="456" y="1097" class="small">Logging, vision and later ML</text><text x="876" y="1016" class="label">Thermal-stage checks</text><text x="876" y="1045" class="small">Airflow / sensor / heartbeat faults</text><text x="876" y="1071" class="small">Simulated SSR-stuck-on shutdown</text><text x="876" y="1097" class="small">Qualified mains review before heat</text><text x="40" y="1170" class="small">Planning draft, not a wiring schematic. No components shown as purchased or electrically validated.</text></svg>