<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title desc">
<title id="title">Tentative roaster electrical architecture</title><desc id="desc">Conceptual power and signal blocks. A hardware safety chain and SSR control the mains heater. An isolated 24 volt supply powers motor and blower drivers, with separate regulated rails for logic and servos. Teensy reads sensors and gates actuator commands; a laptop receives data and camera images. Not a wiring schematic.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a9bca8"/></marker><style>text{font-family:Arial,sans-serif;fill:#eae9e0}.label{font-size:21px;font-weight:bold}.small{font-size:17px;fill:#bac8be}.head{font-size:14px;letter-spacing:2px;fill:#f24d55}.box{fill:#182f27;stroke:#65766a;stroke-width:1.5}.wire{fill:none;stroke:#a9bca8;stroke-width:2;marker-end:url(#arrow)}.signal{fill:none;stroke:#f24d55;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="1120" fill="#0b0e0d"/>
<text x="40" y="45" class="head">COFFEE ROASTER / V1 PLANNING</text><text x="40" y="86" font-size="32" font-weight="bold">Tentative electrical architecture</text><text x="40" y="118" class="small">Functional blocks only. Ratings, pin assignments, protection, and wiring remain to be designed.</text>
<text x="40" y="168" class="head">MAINS HEATER BRANCH — ENCLOSED AND SEPARATED FROM SENSOR WIRING</text>
<rect class="box" x="40" y="190" width="230" height="105"/><text x="60" y="228" class="label">120 VAC supply</text><text x="60" y="258" class="small">Protection / disconnect</text>
<rect class="box" x="325" y="190" width="300" height="105"/><text x="345" y="228" class="label">Hardware safety chain</text><text x="345" y="258" class="small">E-stop / thermal cutoff</text>
<rect class="box" x="680" y="190" width="230" height="105"/><text x="700" y="228" class="label">Zero-cross SSR</text><text x="700" y="258" class="small">Heatsink + enclosure</text>
<rect class="box" x="965" y="190" width="275" height="105"/><text x="985" y="228" class="label">Heater element</text><text x="985" y="258" class="small">120 V / ~1.5–1.6 kW target</text>
<path class="wire" d="M270 242H325M625 242H680M910 242H965"/>
<text x="40" y="328" class="small">Protective earth to exposed metal. Heater power measurement requires an isolated AC-rated instrument.</text>
<text x="40" y="383" class="head">LOW-VOLTAGE POWER — SUPPLY CAPACITY AND BRANCH PROTECTION TBD</text>
<rect class="box" x="40" y="405" width="280" height="115"/><text x="60" y="443" class="label">Isolated 24 VDC supply</text><text x="60" y="476" class="small">Separate protected AC input</text>
<rect class="box" x="390" y="405" width="380" height="115"/><text x="410" y="443" class="label">Motor + blower power</text><text x="410" y="476" class="small">Matched stepper driver / blower drivers</text>
<rect class="box" x="840" y="405" width="400" height="115"/><text x="860" y="443" class="label">Regulated logic + servo rails</text><text x="860" y="476" class="small">Teensy supply, sensors, separate servo power</text>
<path class="wire" d="M320 455H390M320 497H355V547H820V455H840"/>
<text x="40" y="597" class="head">CONTROL + DATA — RED DASHES ARE SIGNALS, NOT POWER WIRES</text>
<rect class="box" x="40" y="620" width="335" height="220"/><text x="60" y="658" class="label">Sensor inputs</text><text x="60" y="693" class="small">Type K / MAX31856 · SPI</text><text x="60" y="725" class="small">RH + vibration + DC power · I2C</text><text x="60" y="757" class="small">Digital microphone · I2S</text><text x="60" y="789" class="small">Shaft encoder · digital inputs</text><text x="60" y="820" class="small">3.3 V-compatible signal interfaces</text>
<rect class="box" x="440" y="620" width="340" height="220"/><text x="460" y="658" class="label">Teensy 4.1</text><text x="460" y="693" class="small">Sensor timestamps + control loop</text><text x="460" y="725" class="small">Command limits / fault handling</text><text x="460" y="757" class="small">SSR duty / step-dir / PWM</text><text x="460" y="789" class="small">Actuator gatekeeper</text><text x="460" y="820" class="small">USB serial to laptop</text>
<rect class="box" x="845" y="620" width="395" height="220"/><text x="865" y="658" class="label">Actuators through drivers</text><text x="865" y="693" class="small">Heater SSR isolated control input</text><text x="865" y="725" class="small">NEMA23 stepper / drum belt drive</text><text x="865" y="757" class="small">Roast blower + cooling blower</text><text x="865" y="789" class="small">Charge / dump servo(s)</text><text x="865" y="820" class="small">Driver logic levels to be checked</text>
<path class="signal" d="M375 735H440M780 735H845"/>
<rect class="box" x="40" y="910" width="335" height="120"/><text x="60" y="948" class="label">USB camera + lighting</text><text x="60" y="980" class="small">Motion camera; color sensor TBD</text><text x="60" y="1010" class="small">Constant-current light / sight glass</text>
<rect class="box" x="440" y="910" width="340" height="120"/><text x="460" y="948" class="label">Laptop / Python</text><text x="460" y="980" class="small">Logging, vision, analysis</text><text x="460" y="1010" class="small">Bounded RPM requests to Teensy</text>
<path class="signal" d="M375 972H440M610 840V910"/>
<text x="845" y="946" class="small">No direct INA226 connection to mains.</text><text x="845" y="980" class="small">USB/VIN backfeed handling TBD.</text><text x="845" y="1014" class="small">Independent heater shutdown required.</text>
<text x="40" y="1080" class="small">Planning diagram · not built or electrically validated · no terminal-level wiring shown</text>
</svg>
